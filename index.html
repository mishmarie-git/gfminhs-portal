<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GFMINHS Portal</title>

    <meta name="description" content="Official GFMINHS Portal">
    <meta name="theme-color" content="#0d6efd">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #212529;
            min-height: 100vh;
        }

        /* HEADER */

        .header {
            background: #0d6efd;
            color: white;
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d6efd;
            font-weight: bold;
            font-size: 13px;
        }

        .header-title h1 {
            font-size: 20px;
        }

        .header-title p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 3px;
        }

        /* MAIN */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 18px 90px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 25px;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #6c757d;
            font-size: 14px;
        }

        /* CARDS */

        .services {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }

        .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .card h3 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 12px;
            color: #6c757d;
        }

        /* INSTALL */

        .install-section {
            margin-top: 25px;
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }

        .install-section h3 {
            margin-bottom: 7px;
        }

        .install-section p {
            color: #6c757d;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .install-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* BOTTOM NAV */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #ddd;
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
        }

        .nav-item {
            text-align: center;
            font-size: 11px;
            color: #6c757d;
            cursor: pointer;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            display: block;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #0d6efd;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .services {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                padding: 20px 10px;
            }

            .welcome h2 {
                font-size: 22px;
            }

            .header {
                padding: 14px 16px;
            }

            .logo {
                width: 42px;
                height: 42px;
            }

            .header-title h1 {
                font-size: 17px;
            }

            .container {
                padding: 22px 14px 85px;
            }
        }

        @media (min-width: 701px) {
            .bottom-nav {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">
        <div class="header-content">

            <div class="logo">
                GF
            </div>

            <div class="header-title">
                <h1>GFMINHS Portal</h1>
                <p>Gov. Ferrer Memorial Integrated National High School</p>
            </div>

        </div>
    </header>


    <!-- MAIN -->

    <main class="container">

        <section class="welcome">
            <h2>Welcome!</h2>
            <p>Access school information, services, resources, and systems.</p>
        </section>


        <!-- SERVICES -->

        <section class="services">

            <button class="card" onclick="openCalendar()">
                <div class="icon">📅</div>
                <h3>School Calendar</h3>
                <p>View school events and activities.</p>
            </button>
<!--
            <button class="card">
                <div class="icon">📢</div>
                <h3>Announcements</h3>
                <p>Latest school announcements.</p>
            </button>

            <button class="card">
                <div class="icon">📚</div>
                <h3>Resources</h3>
                <p>Access school resources.</p>
            </button>

            <button class="card">
                <div class="icon">📄</div>
                <h3>Forms</h3>
                <p>School forms and documents.</p>
            </button>

            <button class="card">
                <div class="icon">👨‍🏫</div>
                <h3>Teacher Resources</h3>
                <p>Resources for teachers and staff.</p>
            </button>

            <button class="card">
                <div class="icon">🎓</div>
                <h3>Student Services</h3>
                <p>Services and information for learners.</p>
            </button>
-->
            <button class="card" onclick="openPortal()">
                <div class="icon">💻</div>
                <h3>School Systems</h3>
                <p>Access GFMINHS online systems.</p>
            </button>

            <button class="card" onclick="showInstall()">
                <div class="icon">📱</div>
                <h3>Install App</h3>
                <p>Install GFMINHS Portal on your device.</p>
            </button>

        </section>


        <!-- INSTALL -->

        <section class="install-section" id="installSection">

            <h3>Install GFMINHS Portal</h3>

            <p>
                Install the portal on your phone for quick access
                from your home screen.
            </p>

            <button class="install-btn" id="installButton">
                Install Portal
            </button>

        </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            Home
        </div>

        <div class="nav-item" onclick="openCalendar()">
            <span class="nav-icon">📅</span>
            Calendar
        </div>

        <div class="nav-item">
            <span class="nav-icon">📚</span>
            Resources
        </div>

        <div class="nav-item">
            <span class="nav-icon">☰</span>
            More
        </div>

    </nav>


    <script>

        /*
         * INSTALL PROMPT
         */

        let deferredPrompt;

        window.addEventListener("beforeinstallprompt", (event) => {

            event.preventDefault();

            deferredPrompt = event;

            document.getElementById("installSection").style.display = "block";

        });


        document.getElementById("installButton").addEventListener("click", async () => {

  // Android / Chrome and other browsers that support the install prompt
  if (deferredPrompt) {
    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;

    console.log("Install result:", outcome);

    deferredPrompt = null;
    return;
  }

  // iPhone / iPad Safari
  const isIOS =
    /iphone|ipad|ipod/i.test(navigator.userAgent) &&
    !window.MSStream;

  if (isIOS) {
    alert(
      "To install GFMINHS Portal on your iPhone/iPad:\n\n" +
      "1. Tap the Share button in Safari.\n" +
      "2. Scroll down and tap 'Add to Home Screen'.\n" +
      "3. Tap 'Add'.\n\n" +
      "The GFMINHS Portal will then appear on your Home Screen."
    );
    return;
  }

  // Android / other browsers without automatic prompt
  alert(
    "To install GFMINHS Portal:\n\n" +
    "Open your browser menu (⋮) and choose " +
    "'Install app' or 'Add to Home screen'."
  );
});


        /*
         * INSTALL SECTION
         */

        function showInstall() {

            document.getElementById("installSection").style.display = "block";

            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

        }


        /*
         * CALENDAR
         *
         * We will connect your EXISTING Apps Script here
         * in the next step.
         */

        function openCalendar() {

            alert("School Calendar will be connected in the next step.");

        }
        function openCalendar() {
            window.location.href =
                "https://script.google.com/macros/s/AKfycbx44gXgn9p_adg7wyYoYGRdXVXX4y9VoZ0Mxflei5Z-1vUnxs-52vOoe57iNWRh1CI/exec";
        }


        /*
         * SERVICE WORKER
         */

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("service-worker.js")
                    .then(() => {
                        console.log("GFMINHS Service Worker registered.");
                    })
                    .catch((error) => {
                        console.error(
                            "Service Worker registration failed:",
                            error
                        );
                    });

            });

        }

    </script>

</body>
</html>
